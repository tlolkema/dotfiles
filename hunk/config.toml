# Match Hunk to the Embark theme used by Ghostty.
theme = "custom"
transparent_background = true
menu_bar = false

[custom_theme]
base = "material-theme"
label = "Embark"
background = "#1e1c31"
panel = "#100e23"
panelAlt = "#2d2b40"
border = "#585273"
accent = "#57c7ff"
accentMuted = "#3e3859"
text = "#eeffff"
muted = "#8a889d"
contextBg = "#1e1c31"
contextContentBg = "#1e1c31"
lineNumberBg = "#1e1c31"
lineNumberFg = "#8a889d"
addedBg = "#323c49"
addedContentBg = "#3f515a"
removedBg = "#3e2941"
removedContentBg = "#52314c"
movedAddedBg = "#40333c"
movedRemovedBg = "#40333c"
addedSignColor = "#a1efd3"
removedSignColor = "#f0719b"
selectedHunk = "#2c4764"
badgeAdded = "#a1efd3"
badgeRemoved = "#f0719b"
badgeNeutral = "#a6b3cc"
fileNew = "#a1efd3"
fileDeleted = "#f0719b"
fileRenamed = "#ffb378"
fileModified = "#57c7ff"
fileUntracked = "#87dfeb"
noteBorder = "#c792ea"
noteBackground = "#2d2b40"
noteTitleBackground = "#3e3859"
noteTitleText = "#eeffff"

[custom_theme.syntax]
default = "#eeffff"
keyword = "#57c7ff"
string = "#ffe9aa"
comment = "#8a889d"
number = "#ffb378"
function = "#f0719b"
property = "#a1efd3"
type = "#63f2f1"
variable = "#eeffff"
operator = "#57c7ff"
punctuation = "#a6b3cc"
